name: Build and Test
description: Build and test MUMPS with CMake workflow

runs:
  using: "composite"

  steps:

  - name: configure
    shell: bash
    run: >-
      cmake --preset default
      -DLAPACK_VENDOR=${{ matrix.lapack_vendor }}

  - name: build, test release
    if: ${{ !matrix.mpich }}
    shell: bash
    run: cmake --workflow default

  - name: build with MPICH
    if: ${{ matrix.mpich }}
    shell: bash
    run: cmake --workflow build

  - name: install package
    shell: bash
    run: cmake --install build
